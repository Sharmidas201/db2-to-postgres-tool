name: Db2 assessment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.lock
      - run: python -m pip install -r requirements-docker.lock
      - run: python -m unittest discover -s tests -p 'test_db2_assessment.py' -v

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t db2-to-postgres-tool:${{ github.sha }} .
