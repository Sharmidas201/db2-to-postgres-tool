name: Build executables

# Run manually from the Actions tab, or push a tag like v1.0.0 to build and attach to a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python packaging/build.py
      - name: Single-file .exe (Windows only)
        if: runner.os == 'Windows'
        run: python packaging/build.py --onefile
      - uses: actions/upload-artifact@v4
        with:
          name: AzureMigrationAssistant-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
